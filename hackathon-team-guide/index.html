const $=id=>document.getElementById(id);let page="準備清單";function saved(){try{return JSON.parse(localStorage.getItem("hackathon-v1")||"{}")}catch{return {}}}function store(k,v){let s=saved();s[k]=v;localStorage.setItem("hackathon-v1",JSON.stringify(s))}function render(){ $("nav").innerHTML=["準備清單","角色分工","賽前分工練習","長輩友善提案","題目與資料","實戰時間軸","情境應變"].map((n,i)=>'<button class="'+(n===page?'active':'')+'" data-tab="'+i+'">'+n+'</button>').join("");let v=$("view");if(page==="準備清單"){let items=Object.entries(sections).flatMap(([k,a])=>a.map((x,i)=>[k,x,i]));let count=items.filter(([k,x,i])=>saved()["t-"+k+"-"+i]).length;v.innerHTML='<div class="panel"><h2>賽前準備總覽</h2><div class="note">此清單包含官方規定與團隊建議；下方「規則核對」明確區分已核對及尚待確認的事項。</div><p>'+count+' / '+items.length+' 項完成</p><div class="bar"><div style="width:'+(100*count/items.length)+'%"></div></div><p><button onclick="copyTasks()">複製進度給組員</button></p></div>'+Object.entries(sections).map(([k,a])=>'<section class="panel"><h2>'+k+'</h2>'+a.map((x,i)=>'<label class="task"><input type="checkbox" '+(saved()["t-"+k+"-"+i]?'checked':'')+' onchange="store(\'t-'+k+'-'+i+'\',this.checked);render()"><span>'+x+'</span></label>').join('')+'</section>').join('')+'<div class="panel"><h2>官方規則與待確認事項</h2>'+official.map(x=>'<div class="note '+(x[0].includes("尚待")?'warning':'')+'"><b>'+x[0]+'</b><p>'+x[1]+'</p></div>').join('')+'</div>'}else if(page==="角色分工"){v.innerHTML='<h2>五人正式角色職責</h2><p>這裡說明比賽期間的責任；賽前應做的練習請到「賽前分工練習」。</p><div class="grid">'+people.map(p=>'<div class="panel"><h2>'+p[0]+'</h2><b>'+p[1]+'</b><p>'+p[2]+'</p><p><b>角色成果：</b>'+p[3]+'</p><p class="muted">'+p[4]+'</p></div>').join('')+'</div>'}else if(page==="賽前分工練習"){v.innerHTML='<div class="panel"><h2>五人賽前訓練與實作驗收</h2><p>與正式角色職責分開；每人至少要有可操作原型、啟動步驟、已知限制和整合接口。</p></div>'+prep.map((p,j)=>'<div class="panel"><h2>'+p[0]+'</h2><p class="muted">完成 '+p[1].filter((x,i)=>saved()["prep-"+j+"-"+i]).length+' / '+p[1].length+'</p>'+p[1].map((x,i)=>'<label class="task"><input type="checkbox" '+(saved()["prep-"+j+"-"+i]?'checked':'')+' onchange="store(\'prep-'+j+'-'+i+'\',this.checked);render()"><span>'+x+'</span></label>').join('')+'</div>').join('')}
else if(page==="長輩友善提案"){v.innerHTML='<div class="panel"><span class="tag">初賽提案</span><span class="tag">非正式題目</span><h2>長輩友善模式｜獨立專區</h2><p>核心是降低操作、理解與資訊取得門檻；正式題目公布前不應把長輩方向寫死。</p></div>'+senior.map(x=>'<div class="panel"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('')+'<div class="panel"><h2>五人如何配合</h2><ol><li>Abby：確認痛點、流程、MVP、驗收。</li><li>你：大按鈕首頁、查詢、結果與錯誤狀態。</li><li>恩多：政府資料、JSON 契約、更新時間。</li><li>書慧：Flutter、WebView、權限與 Android 展示。</li><li>欣怡：語音／朗讀模組與文字備援。</li></ol></div>'}
else if(page==="題目與資料"){v.innerHTML='<div class="panel"><h2>預測題目與可查證資料來源</h2><div class="note">正式題目 11/7 才公布。以下為備案推演，資料平台僅是查證起點；須確認資料集、欄位、授權、更新頻率與競賽規則。</div></div><div class="grid">'+topicData.map(t=>'<div class="panel"><div class="topic-art">'+t[0]+'</div><h3>'+t[1]+'</h3><p><b>可能解法：</b>'+t[2]+'</p><details><summary>查看資料、流程及風險</summary><ul>'+t[3].map(d=>'<li><a href="'+d[1]+'" target="_blank" rel="noopener">'+d[0]+'</a>：'+d[2]+'</li>').join('')+'</ul><p><b>操作流程：</b>'+t[4]+'</p><p><b>風險與備案：</b>'+t[5]+'</p></details></div>').join('')+'</div><div class="panel"><h2>選題時的實務檢查</h2><ol><li>是否符合當天公布的正式題目與指定族群？</li><li>是否能取得合法且足夠的資料？</li><li>是否能在 23.5 小時完成可操作的 MVP？</li><li>介面是否讓目標族群真正容易使用？</li><li>TownPass／WebView 是否能穩定展示？</li></ol><p>官方初選評分項目：服務應用 40%、視覺呈現 30%、技術完整度 30%。不提供缺乏依據的預測分數。</p></div>'}else if(page==="實戰時間軸"){v.innerHTML='<div class="panel"><h2>23.5 小時實戰</h2><p>11/7 10:30 至 11/8 10:00。以下是團隊建議節奏，不是主辦單位強制安排。</p></div>'+stages.map((s,i)=>'<div class="panel"><span class="pill">'+s[0]+'</span><h2>'+s[1]+'</h2><p>'+s[2]+'</p><p><b>驗收：</b>'+s[3]+'</p><label class="task"><input type="checkbox" '+(saved()["stage-"+i]?'checked':'')+' onchange="store(\'stage-'+i+'\',this.checked)">本階段已驗收</label></div>').join('')}else if(page==="情境應變"){v.innerHTML='<div class="panel"><h2>突發情境演練</h2><p>隨機抽題後，先讓組員說出處置方式，再展開答案。</p><button onclick="pickRisk()">隨機抽一題</button><div id="picked"></div></div><div class="panel"><h2>完整應變手冊（'+risks.length+' 種）</h2>'+risks.map((r,i)=>'<details id="risk'+i+'"><summary>'+r[0]+'</summary><p>'+r[1]+'</p><p class="muted">主責：'+r[2]+'</p></details>').join('')+'</div>'}}function openRisk(){page="情境應變";render();pickRisk()}document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-tab]");if(b){page=["準備清單","角色分工","賽前分工練習","長輩友善提案","題目與資料","實戰時間軸","情境應變"][Number(b.dataset.tab)];render()}});function pickRisk(){let i=Math.floor(Math.random()*risks.length),r=risks[i];$("picked").innerHTML='<div class="panel"><b>抽中：'+r[0]+'</b><p>請先說出你的處理方式，再展開下方同名情境查看建議解法。</p><button onclick="document.getElementById(\'risk'+i+'\').open=true;document.getElementById(\'risk'+i+'\').scrollIntoView({behavior:\'smooth\'})">查看解法</button></div>'}function copyTasks(){let s=Object.entries(sections).flatMap(([k,a])=>a.map((x,i)=>(saved()["t-"+k+"-"+i]?"☑ ":"☐ ")+k+"｜"+x)).join("\n");navigator.clipboard.writeText(s).then(()=>alert("已複製，貼到 LINE 即可")).catch(()=>prompt("請複製以下文字",s))}render();
</script></html>
