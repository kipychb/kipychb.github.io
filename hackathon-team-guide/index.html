<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 黑客松團隊作戰中心</title><style>body{margin:0;background:#f5f7fb;color:#182334;font:16px system-ui,"Noto Sans TC",sans-serif}header{background:#16243c;color:white;padding:32px max(20px,calc((100vw - 980px)/2))}h1{font-size:29px;margin:0 0 10px}h2{font-size:23px}p{line-height:1.7}.wrap{max-width:980px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button,select{border:1px solid #c9d2df;background:white;border-radius:9px;padding:11px 14px;cursor:pointer;font:inherit}button.active{background:#176e75;color:white}.panel{background:white;border:1px solid #e1e6ef;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #17233c0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.muted{color:#637087}.pill{background:#e7f3f2;border-radius:30px;padding:5px 10px;font-size:13px}.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #edf0f4}.task input{width:19px;height:19px;flex-shrink:0}.task small{display:block;color:#687687}.hidden{display:none}.bar{background:#e7ebf1;border-radius:10px;height:12px;overflow:hidden}.bar div{height:100%;background:#148b83;transition:.2s}details{padding:12px 0;border-bottom:1px solid #e9edf3}summary{font-weight:650;cursor:pointer}li{margin:9px 0;line-height:1.5}.score{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0}.score select{min-width:85px}a{color:#116a78}@media(max-width:600px){header{padding:24px 18px}h1{font-size:24px}.panel{padding:15px}} </style><header><h1>2026 台北秋季黑客松｜團隊作戰中心</h1><p>賽前準備 × 五人分工 × 23.5 小時實戰 × 突發情境演練</p><span class="pill">11/7 10:30 → 11/8 10:00</span></header><main class="wrap"><nav id="nav"></nav><div id="view"></div><p class="muted">勾選與評分儲存在目前瀏覽器，不會跨裝置或組員同步。正式題目、AI 使用及預先開發限制請以主辦單位公告為準。</p></main><script>
const people=[["Abby","A｜PM／UX","題目拆解、MVP、驗收、Demo","需求模板、操作流程、90 秒提案、Demo 腳本","與 B 確認頁面與驗收；與全員確認範圍"],["你","B｜前端／UI","HTML/CSS/JS、手機介面、API 串接","首頁、查詢頁、結果頁、載入與錯誤狀態","與 C 約定 JSON；與 D 確認 WebView；與 E 約定元件接口"],["恩多","C｜後端／API","開放資料、資料清理、API、錯誤處理","可測 API、資料來源與更新頻率、回傳格式","與 B 對齊欄位；與 D 排除跨域及網路問題"],["書慧","D｜Flutter／整合","TownPass、WebView、Git、Android Demo","TownPass 可執行、WebView 測試、整合版本","與 B 測網頁載入；與 C 測連線；管理穩定版本"],["欣怡","E｜獨立功能","語音／多語／輔助模組與備援","可獨立呼叫的功能、失敗降級方式","與 B/C 定義輸入輸出；跨組支援核心流程"]];const sections={"行政與物品":["全員確認 11/7、11/8 可出席","交通規劃：建議 08:30～08:45 抵達","攜帶身分證明文件","筆電、充電器、手機、傳輸線","行動電源、延長線及網路備援","環保杯、餐具、盥洗及個人藥品","確認 AGPL 授權與作品保存規範"],"軟體與技術":["Git、VS Code 可執行","Flutter/FVM 版本及相容性確認","Android Studio／SDK 可執行","TownPass 專案可啟動","GitHub clone、branch、PR、merge 演練","WebView 能載入測試頁","政府 API 已驗證並記錄來源","Chrome DevTools／Postman 可用","Demo 網路及裝置備援已測試"],"團隊協作":["A～E 角色與備援人選確認","建立 Repo、分支與合併規範","建立 LINE／任務看板與回報節奏","練習 60～90 秒提案決策","完成一次 90 分鐘讀題模擬","完成一次 4 小時整合模擬","完成一次 8 小時縮時模擬","每位組員都會啟動自己的模組"],"題目與資料":["整理可重用的友善介面元件","研究高齡、多語、無障礙等不同需求","驗證公車、垃圾車或天氣資料","準備三個可切換的解題方向","向主辦單位確認 AI／賽前程式規範","準備文字、按鈕與語音的降級方案"]};const stages=[["11/7 10:30–11:30","讀題與決策","Abby 主持讀題；B 畫操作路徑；C 驗證資料；D 評估整合；E 評估附加功能","選定一個族群、一個痛點、一條核心流程"],["11:30–13:30","技術驗證與骨架","B 做假資料介面；C 提供 API 格式；D 啟動 WebView；E 完成獨立模組骨架；A 設驗收","可操作前端骨架、API 契約、WebView 載入"],["13:30–17:30","核心開發","B/C 平行開發；D 測整合；E 做模組；A 檢查需求偏移","17:30 前核心流程在瀏覽器可運作"],["17:30–19:00","第一次整合","B+C 接資料；D 接 WebView；E 視穩定度整合；A 依流程驗收","完成端到端測試，記錄阻塞問題"],["19:00–23:30","功能補強與除錯","優先錯誤狀態、資料正確性、手機顯示；加分功能有時間才做","23:30 前有可展示整合版"],["23:30–02:00","建立穩定版本與輪休","標記穩定 commit、保留備份；輪流休息","任何人可依 README 啟動 Demo"],["02:00–05:30","測試與體驗優化","跨組測試、無網路、權限拒絕、API 空資料、返回操作","重大錯誤清零"],["05:30–07:30","Demo 與驗收","Abby 帶展示；B 檢查介面；C 核資料；D 驗裝置；E 驗附加功能","07:30 功能凍結"],["07:30–08:30","最後整合","只修阻擋展示的錯誤，不再增加功能","鎖定展示版本"],["08:30–09:30","展示彩排","完整演練三次，包含備援網路與備用入口","非開發者也能操作"],["09:30–10:00","初選前確認","確認電量、登入、網路、提交格式與展示入口","10:00 前準備完成"]];const risks=[["正式題目與長輩模式無關","保留輸入→查詢→易讀結果架構；更換族群、文案、資料來源；先驗證題目符合度。","Abby＋全員"],["政府 API 連線失敗","檢查 URL、金鑰、CORS、配額、逾時；設 20 分鐘修復時限，逾時改已驗證來源或簡化服務。模擬資料須明確標示。","恩多＋你"],["API 欄位改版或資料錯誤","比對官方文件與原始回應，後端統一轉換；前端處理 null、空陣列與時間格式。","恩多"],["WebView 白畫面","先用 Chrome 確認頁面；再檢查資源路徑、HTTPS、網路權限、WebView console；保留瀏覽器備案並確認合規。","書慧＋你"],["Flutter 無法建置","檢查 Flutter/FVM、SDK、Gradle、套件版本；回退最後成功版本；不要在截止前升級工具鏈。","書慧"],["Git 合併衝突","停止多人修改同檔；由書慧與修改者解衝突，先備份，避免 force push 覆蓋他人成果。","書慧＋相關組員"],["AI／語音辨識失敗","降級為按鈕與文字輸入；規則式分類代替模型；先確認雲端與端側使用規則。","欣怡＋你"],["網路或 Wi-Fi 不穩","切換手機熱點；降低 API 請求頻率；顯示連線狀態；測試資料不得冒充即時結果。","書慧＋恩多"],["手機與瀏覽器排版不同","測 360px、390px 寬度、字體縮放、鍵盤遮擋、捲動與觸控尺寸；優先修阻擋操作的問題。","你"],["使用者拒絕定位或麥克風","顯示權限說明與替代路徑：手動選區域／文字輸入；不可強迫授權。","你＋欣怡"],["資料查無結果","提供清楚空狀態、修改條件與返回入口；不可顯示虛構結果。","你＋恩多"],["題目臨時增加限制","Abby 重新確認必備條件，凍結非核心功能；全員評估最短合規路徑。","Abby"],["有人疲勞或暫時離席","重要工作至少有 README 與可接手人；排輪休，關鍵展示者保留精神。","Abby＋全員"],["剩三小時仍未完成","立即救援：只保留一條穩定流程，關閉次要功能，固定 Demo 路徑，鎖定穩定 commit。","Abby＋全員"],["Demo 現場當機","準備備用裝置、重啟步驟、備用網路；說明真實已完成範圍，不將錄影冒充即時 Demo。","書慧＋Abby"],["評審詢問資料可信度或成本","展示官方資料來源、更新時間、失敗處理、服務對象、部署成本與後續擴充方式。","恩多＋Abby"],["無障礙功能遭質疑","依指定族群測讀屏、鍵盤、對比、文字大小；未經實際驗證不要宣稱完全符合無障礙標準。","你＋Abby"],["授權或提交格式不清楚","提前向主辦單位確認 AGPL、賽前程式、AI、作品提交與 Demo 要求；留存回覆。","Abby＋書慧"]];const $=id=>document.getElementById(id);let page="準備清單";function saved(){try{return JSON.parse(localStorage.getItem("hackathon-v1")||"{}")}catch{return {}}}function store(k,v){let s=saved();s[k]=v;localStorage.setItem("hackathon-v1",JSON.stringify(s))}function render(){ $("nav").innerHTML=["準備清單","角色分工","實戰時間軸","情境應變","選題評分","模擬演練"].map(n=>'<button class="'+(n===page?'active':'')+'" onclick="page='+JSON.stringify(n)+';render()">'+n+'</button>').join("");let v=$("view");if(page==="準備清單"){let items=Object.entries(sections).flatMap(([k,a])=>a.map((x,i)=>[k,x,i]));let count=items.filter(([k,x,i])=>saved()["t-"+k+"-"+i]).length;v.innerHTML='<div class="panel"><h2>賽前準備總覽</h2><p>'+count+' / '+items.length+' 項完成</p><div class="bar"><div style="width:'+(100*count/items.length)+'%"></div></div><p><button onclick="copyTasks()">複製進度給組員</button></p></div>'+Object.entries(sections).map(([k,a])=>'<section class="panel"><h2>'+k+'</h2>'+a.map((x,i)=>'<label class="task"><input type="checkbox" '+(saved()["t-"+k+"-"+i]?'checked':'')+' onchange="store(\'t-'+k+'-'+i+'\',this.checked);render()"><span>'+x+'</span></label>').join('')+'</section>').join('')}else if(page==="角色分工"){v.innerHTML='<h2>五人角色與交付成果</h2><div class="grid">'+people.map(p=>'<div class="panel"><h2>'+p[0]+'</h2><b>'+p[1]+'</b><p>'+p[2]+'</p><p><b>賽前交付：</b>'+p[3]+'</p><p class="muted">'+p[4]+'</p></div>').join('')+'</div>'}else if(page==="實戰時間軸"){v.innerHTML='<div class="panel"><h2>23.5 小時實戰</h2><p>11/7 10:30 至 11/8 10:00。以下是團隊建議節奏，不是主辦單位強制安排。</p></div>'+stages.map((s,i)=>'<div class="panel"><span class="pill">'+s[0]+'</span><h2>'+s[1]+'</h2><p>'+s[2]+'</p><p><b>驗收：</b>'+s[3]+'</p><label class="task"><input type="checkbox" '+(saved()["stage-"+i]?'checked':'')+' onchange="store(\'stage-'+i+'\',this.checked)">本階段已驗收</label></div>').join('')}else if(page==="情境應變"){v.innerHTML='<div class="panel"><h2>突發情境演練</h2><p>隨機抽題後，先讓組員說出處置方式，再展開答案。</p><button onclick="pickRisk()">隨機抽一題</button><div id="picked"></div></div><div class="panel"><h2>完整應變手冊（'+risks.length+' 種）</h2>'+risks.map((r,i)=>'<details id="risk'+i+'"><summary>'+r[0]+'</summary><p>'+r[1]+'</p><p class="muted">主責：'+r[2]+'</p></details>').join('')+'</div>'}else if(page==="選題評分"){let opts=["高齡友善服務","多語市政導航","無障礙資訊入口"];let metrics=[["符合正式題目",30],["使用者痛點與公益價值",20],["23 小時內可完成",25],["資料與技術可行",15],["可延用模組",10]];v.innerHTML='<div class="panel"><h2>正式題目公布後的方案評分</h2><p>每項 1–5 分，分數為團隊自行評估；若違反官方規則直接淘汰，不看總分。</p></div><div class="grid">'+opts.map((o,j)=>'<div class="panel"><h2>'+o+'</h2>'+metrics.map(([m,w],i)=>'<div class="score"><span>'+m+'（'+w+'%）</span><select id="s'+j+'-'+i+'" onchange="score()">'+[1,2,3,4,5].map(n=>'<option '+((saved()["s"+j+"-"+i]||3)==n?'selected':'')+'>'+n+'</option>').join('')+'</select></div>').join('')+'<h2 id="total'+j+'"></h2></div>').join('')+'</div>';score()}else{v.innerHTML='<div class="panel"><h2>模擬 1｜90 分鐘讀題決策</h2><p>0–15 分讀題；15–35 分提 2–3 案；35–55 分評分；55–75 分定 MVP；75–90 分確定 API 契約與交付。</p><p><b>驗收：</b>每個人都能說明自己的任務、資料依賴及備援。</p></div><div class="panel"><h2>模擬 2｜4 小時技術整合</h2><p>0–30 分定流程；30–150 分平行開發；150–210 分前後端及 WebView 整合；210–240 分測試與 Demo。</p><p><b>驗收：</b>完整執行查詢→API→結果頁，並成功合併 Git。</p></div><div class="panel"><h2>模擬 3｜8 小時縮時黑客松</h2><p>0–1h 讀題；1–3h 開發；3–4h 整合；4h 隨機插入突發情境；4–6h 修復；6–7h 測試；7–8h 三分鐘 Demo 與問答。</p><p><button onclick="page='情境應變';render();pickRisk()">抽取故障情境</button></p></div><div class="panel"><h2>正式賽事提醒</h2><p>11/7 09:00–09:30 報到，建議提前到場；11/8 10:00–13:30 初選；若晉級，再準備決選展示。作品須能實際操作，規則以主辦單位現場公告為準。</p></div>'}}function score(){for(let j=0;j<3;j++){let total=0;[30,20,25,15,10].forEach((w,i)=>{let el=$("s"+j+"-"+i);if(el){let n=+el.value;store("s"+j+"-"+i,n);total+=n*w/5}});if($("total"+j))$("total"+j).textContent="加權總分："+Math.round(total)+" / 100"}}function pickRisk(){let i=Math.floor(Math.random()*risks.length),r=risks[i];$("picked").innerHTML='<div class="panel"><b>抽中：'+r[0]+'</b><p>請先說出你的處理方式，再展開下方同名情境查看建議解法。</p><button onclick="document.getElementById(\'risk'+i+'\').open=true;document.getElementById(\'risk'+i+'\').scrollIntoView({behavior:\'smooth\'})">查看解法</button></div>'}function copyTasks(){let s=Object.entries(sections).flatMap(([k,a])=>a.map((x,i)=>(saved()["t-"+k+"-"+i]?"☑ ":"☐ ")+k+"｜"+x)).join("\n");navigator.clipboard.writeText(s).then(()=>alert("已複製，貼到 LINE 即可")).catch(()=>prompt("請複製以下文字",s))}render();
</script></html>
